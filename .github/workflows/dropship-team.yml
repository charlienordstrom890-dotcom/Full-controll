name: Dropship-teamet

# Kör teamet automatiskt. Kräver hemligheten CLAUDE_CODE_OAUTH_TOKEN
# (skapas med `claude setup-token`, använder ditt Claude-abonnemang = billigast)
# eller ANTHROPIC_API_KEY (betalas per användning).
on:
  schedule:
    - cron: "17 5 * * 1"   # måndagar ca 06–07 svensk tid: veckocykel
    - cron: "17 5 * * 4"   # torsdagar: hitta nya produkter
  workflow_dispatch:
    inputs:
      lage:
        description: "Läge: hitta-produkter, veckocykel eller lansera <produkt>"
        required: true
        default: hitta-produkter

permissions:
  contents: write
  id-token: write

concurrency:
  group: dropship-team
  cancel-in-progress: false

jobs:
  team:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Välj läge
        id: lage
        env:
          INPUT_LAGE: ${{ github.event.inputs.lage }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_LAGE" ]; then l="$INPUT_LAGE"
          elif [ "$SCHEDULE" = "17 5 * * 1" ]; then l="veckocykel"
          else l="hitta-produkter"; fi
          echo "lage=$l" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Kör /dropship-team ${{ steps.lage.outputs.lage }}.
            Du kör obevakat i CI: ställ inga frågor, gör inga köp, starta inga annonser och
            publicera ingenting. Skriv resultat till butik/ och rapporter/ enligt skillen.
            DSers kräver inloggning och är inte tillgänglig här — använd webbresearch.
          claude_args: "--max-turns 60 --allowedTools Agent,Skill,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Spara rapporter
        run: |
          git config user.name "dropship-team"
          git config user.email "actions@users.noreply.github.com"
          git add butik rapporter
          git diff --cached --quiet || git commit -m "Dropship-teamet: ${{ steps.lage.outputs.lage }} $(date +%F)"
          git push
